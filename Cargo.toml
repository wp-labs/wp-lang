[package]
name = "wp-lang"
version = "0.2.0" #@gxl:set(version)
edition = "2024"
description = "WPL language crate with AST, parser, evaluator, builtins, and generators."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/wp-labs/wp-lang"
homepage = "https://github.com/wp-labs/wp-lang"
documentation = "https://docs.rs/wp-lang"
categories = ["parsing", "text-processing"]
keywords = ["wpl", "dsl", "parser", "runtime", "warp"]

[lib]
name = "wpl"
harness = true

[features]
default = []
check = []

[dependencies]
smol_str = { version = "0.3", features = ["serde"] }
derive_more = "2.1"
wp-model-core = "0.8"
wp-data-fmt = "0.2"
wp-parse-api = "0.9"
wp-connector-api = "0.9"
wp-error = "0.9"
wp-log = "0.3"
wp-specs = "0.9"
orion-error = "0.7"
wp_primitives = { package = "wp-primitives", version = "0.2" }
derive-getters = "0.5"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

wildmatch = "2.6"
thiserror = "2.0"
ipnet = { version = "2.12", features = ["json"] }
strfmt = "0.2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
rand = "0.10"
contracts = "0.6"
winnow = "1.0"
glob = "0.3"
toml = "1.0"
unicode-segmentation = "1.12"
hex = "0.4"
mailchecker = "6.0"
url = "2.5"
phone = "0.1"
ahash = "0.8"
once_cell = "1.21"
bytes = "1.11"
regex = "1.12"

[dev-dependencies]
criterion = "0.8"
mockall = "0.14"

[[bench]]
name = "wpl_pipe_bench"
harness = false

[[bench]]
name = "nginx_10k"
harness = false

[[bench]]
name = "wpl_bench"
harness = false

[[bench]]
name = "sep_pattern_bench"
harness = false

[[bench]]
name = "multi_rule_error"
harness = false
